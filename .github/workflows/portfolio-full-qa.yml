name: Portfolio full website QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'portfolio-site/**'
      - 'portfolio-membership-api/**'
      - '.github/workflows/portfolio-full-qa.yml'
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All frontend and backend JavaScript syntax
        run: |
          for file in portfolio-site/*.js portfolio-site/qa/*.mjs portfolio-membership-api/*.js; do
            node --check "$file"
          done
      - name: Existing unit and integration suite
        run: node --test portfolio-site/tests/*.test.mjs
      - name: Install isolated Chromium test runner
        run: |
          npm install --no-save --no-package-lock --prefix portfolio-site/qa playwright@1.55.1 @axe-core/playwright@4.10.2
          cd portfolio-site/qa
          npx playwright install --with-deps chromium
      - name: Run real browser interaction checks (offline API fixtures)
        run: |
          python3 -m http.server 4173 --directory portfolio-site > /tmp/portfolio-qa-server.log 2>&1 &
          sleep 2
          node portfolio-site/qa/browser-smoke.mjs
      - name: Check out production baseline for same-run performance comparison
        uses: actions/checkout@v4
        with:
          ref: master
          path: qa-baseline
          persist-credentials: false
      - name: Serve baseline and measure Lighthouse mobile
        continue-on-error: true
        run: |
          python3 -m http.server 4174 --directory qa-baseline/portfolio-site >/tmp/portfolio-baseline-http.log 2>&1 &
          sleep 2
          mkdir -p portfolio-site/qa-results/lighthouse-branch
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4174/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json --output-path=portfolio-site/qa-results/lighthouse-branch/baseline.json \
            --quiet --max-wait-for-load=45000
      - name: Measure branch mobile Lighthouse before deployment
        id: branch-performance
        continue-on-error: true
        run: |
          mkdir -p portfolio-site/qa-results/lighthouse-branch
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json --output-path=portfolio-site/qa-results/lighthouse-branch/mobile.json \
            --quiet --max-wait-for-load=45000
          node portfolio-site/qa/print-branch-lighthouse.mjs
      - name: WCAG 2.1 AA first-party accessibility release gate
        run: node portfolio-site/qa/accessibility-audit.mjs
      - name: Read-only production UI smoke (external APIs safely mocked)
        id: production-smoke
        continue-on-error: true
        env:
          QA_BASE_URL: https://badbunny.work
          QA_OUTPUT: portfolio-site/qa-results/production
        run: node portfolio-site/qa/browser-smoke.mjs
      - name: Lighthouse on actual production URL
        id: lighthouse
        continue-on-error: true
        run: |
          mkdir -p portfolio-site/qa-results/lighthouse
          npx --yes lighthouse@12.8.2 https://badbunny.work/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json --output-path=portfolio-site/qa-results/lighthouse/mobile.json \
            --quiet --max-wait-for-load=45000
          npx --yes lighthouse@12.8.2 https://badbunny.work/ \
            --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json --output-path=portfolio-site/qa-results/lighthouse/desktop.json \
            --quiet --max-wait-for-load=45000
      - name: Summarize Lighthouse production scores
        if: always()
        run: node portfolio-site/qa/print-lighthouse.mjs
      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: portfolio-site/qa-results/
          if-no-files-found: warn
