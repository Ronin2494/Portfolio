name: Sync creator Instagram journal
on:
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-instagram-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest Instagram posts with owner authorization
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/sync-instagram-posts.mjs
      - name: Validate public post catalog
        run: node --test portfolio-site/tests/instagram-guides.test.mjs
      - name: Publish updated catalog
        run: |
          if git diff --quiet -- portfolio-site/instagram-posts.json; then
            echo 'No new Instagram posts.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portfolio-site/instagram-posts.json
          git commit -m 'chore: sync Instagram journal posts'
          git push origin HEAD:master
